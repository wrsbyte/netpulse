[project]
name = "netpulse"
version = "0.1.0"
description = "Local, always-on network health & analysis for a single host (WiFi/ISP/DNS layer separation)."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Wilmer Rodriguez" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "apscheduler>=3.11",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.scripts]
netpulse-collector = "netpulse.collector:main"
netpulse-api = "netpulse.api.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "ASYNC"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["netpulse"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
